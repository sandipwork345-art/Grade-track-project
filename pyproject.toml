[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gradebook"
version = "0.1.0"
description = "A small package to calculate averages and grades from a class marks file"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "numpy",
    "matplotlib"
]

[tool.setuptools]
packages = ["gradebook"]
